name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, semver from the Minecraft version (26.60.5)
        required: true
        type: string
      amml_ref:
        description: amml branch, tag or commit to build against
        required: false
        type: string
        default: master

permissions:
  contents: write

jobs:
  release:
    uses: alaydriem/amml/.github/workflows/release-mod.yml@master
    with:
      version: ${{ inputs.version }}
      amml_ref: ${{ inputs.amml_ref }}
      path: stratum
      namespace: alaydriem
      name: stratum
      package_task: package
      descriptor: stratum/amml/descriptor.hcl
