[workspace]
resolver = "3"
members = ["stratum/core", "stratum/ui", "stratum/tools", "stratum/amml"]

[workspace.package]
version = "26.62.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
crossbeam-channel = "0.5.17"
serde_json = "1.0.154"
png = "0.18.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
criterion = "=0.8.2"
thiserror = "2.0.17"
curia = "=0.2.2"
hcl-rs = "=0.19.8"
windows = "0.62.2"
amml-ui = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amml-i18n = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amml-i18n-tool = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amml-ui-rules = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amml-sdk = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amml-game = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amml-msvc = { git = "https://github.com/Alaydriem/amml.git", tag = "26.62.0" }
amm-abi = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.62.0" }
amm-client = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.62.0" }
amm-core = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.62.0" }
stratum-core = { path = "stratum/core" }
stratum-ui = { path = "stratum/ui" }
stratum-tools = { path = "stratum/tools" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
