[workspace]
resolver = "3"
members = ["src/core", "src/ui", "src/tools", "src/amml"]

[workspace.package]
version = "26.63.4"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
crossbeam-channel = "0.5.17"
serde_json = "1.0.154"
png = "0.18.1"
flate2 = "1.1.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
criterion = "=0.8.2"
thiserror = "2.0.17"
curia = "=0.2.2"
hcl-rs = "=0.19.8"
windows = "0.62.2"
# Path dependencies until the release tag: AMML and the mod manager are not tagged for the v3 API yet.
amml-api = { path = "../amml/sdk/api" }
amml-ui = { path = "../amml/ui/kit" }
amml-i18n = { path = "../amml/i18n/runtime" }
amml-i18n-tool = { path = "../amml/i18n/tool" }
amml-ui-rules = { path = "../amml/ui/rules" }
amm-abi = { path = "../modmanager/crates/amm-abi" }
amm-client = { path = "../modmanager/crates/amm-client", default-features = false }
amm-core = { path = "../modmanager/crates/amm-core" }
stratum-core = { path = "src/core" }
stratum-ui = { path = "src/ui" }
stratum-tools = { path = "src/tools" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# amm-client takes the UI and translation crates from the amml repository by tag; these point it at the same working
# tree as above, so one copy of each is in the build (the localizer and the egui types cross between them)
[patch."https://github.com/Alaydriem/amml.git"]
amml-ui = { path = "../amml/ui/kit" }
amml-i18n = { path = "../amml/i18n/runtime" }
amml-i18n-tool = { path = "../amml/i18n/tool" }
amml-ui-rules = { path = "../amml/ui/rules" }
