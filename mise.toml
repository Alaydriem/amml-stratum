[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting; also with the stratum-amml gate feature"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo check -p stratum-amml --all-targets --features gate",
  "cargo clippy -p stratum-amml --all-targets --features gate -- -D warnings",
  "cargo fmt -p stratum-core -p stratum-ui -p stratum-tools -p stratum-amml --check",
]

[tasks.test]
description = "Every test through cargo nextest run; also runs the stratum-amml tests again with the gate feature"
dir = "{{config_root}}"
run = [
  "cargo nextest run --workspace",
  "cargo nextest run -p stratum-amml --features gate",
]

[tasks.bench]
description = "Every stratum-core Criterion bench, at most 8 build jobs; arguments after the task name filter the benches"
dir = "{{config_root}}"
env = { CARGO_BUILD_JOBS = "8" }
run = "cargo bench -p stratum-core"

[tasks."i18n:extract"]
description = "Writes src/ui/i18n/stratum.pot from the StratumMessage enum"
dir = "{{config_root}}"
run = "cargo run -q -p stratum-ui --example stratum_i18n_extract"

[tasks."i18n:check"]
description = "Fails when src/ui/i18n/stratum.pot is out of date with the StratumMessage enum"
dir = "{{config_root}}"
run = "cargo run -q -p stratum-ui --example stratum_i18n_extract -- --check"

[tasks.package]
description = "Builds dist/@alaydriem/stratum/ (alaydriem_stratum.dll, amml.hcl, OFL.txt), the release artifact; also `--features <list>` passes cargo features, for example `gate`"
dir = "{{config_root}}"
shell = "bash -c"
usage = 'flag "--features <features>" help="Cargo features of stratum-amml, comma separated"'
run = '''
set -e
if [ -n "${usage_features:-}" ]; then cargo build --release -p stratum-amml --features "$usage_features"; else cargo build --release -p stratum-amml; fi
rm -rf dist/@alaydriem/stratum
mkdir -p dist/@alaydriem/stratum
cp target/release/alaydriem_stratum.dll dist/@alaydriem/stratum/alaydriem_stratum.dll
cp src/amml/amml.hcl dist/@alaydriem/stratum/amml.hcl
cp src/amml/icon.png dist/@alaydriem/stratum/icon.png
# the DLL embeds the NordwandMono font from amml-ui; its licence ships beside it
ui_manifest=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "amml-ui") | .manifest_path')
cp "$(dirname "$ui_manifest")/assets/fonts/OFL.txt" dist/@alaydriem/stratum/OFL.txt
if find dist -name '*.pdb' | grep -q .; then echo "a .pdb is in dist/; debug symbols are never shipped"; exit 1; fi
echo "built dist/@alaydriem/stratum (features: ${usage_features:-none})"
'''

[tasks.samples]
description = "Writes the synthetic .mcstructure samples into samples/ at the repo root"
dir = "{{config_root}}"
run = "cargo run -q --release -p stratum-tools --bin generate_samples -- samples"

[tools]
# cargo metadata is read with it, to find the amml sources cargo fetched
jq = "1.8.1"

[tasks.install]
description = "Runs package, then copies dist/@alaydriem/stratum into mods/amml/@alaydriem/stratum of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, required). The mod's config/ stays. Close the game first: a running game locks the DLL"
depends = ["package"]
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" required=#true help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
instance="$LOCALAPPDATA/amml/instances/${usage_instance:?--instance is required}"
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
target="$instance/mods/amml/@alaydriem/stratum"
mkdir -p "$target"
cp -r dist/@alaydriem/stratum/. "$target/"
echo "installed dist/@alaydriem/stratum -> $target"
'''
