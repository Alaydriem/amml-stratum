[package]
name = "stratum-amml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "alaydriem_stratum"
crate-type = ["cdylib", "rlib"]

[features]
# the in-game proof: on the first world, one stone mesh, the block lookups, one chest and one skull ghost and, with the
# build conditions true, one palette probe, one kinds scan and one setblock
gate = []

[dependencies]
amm-client = { workspace = true, features = ["egui"] }
amm-core = { workspace = true, features = ["egui"] }
amml-api.workspace = true
crossbeam-channel.workspace = true
curia.workspace = true
egui.workspace = true
stratum-core.workspace = true
stratum-ui.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
amm-abi.workspace = true
amm-client = { workspace = true, features = ["egui", "test-support"] }
amml-api = { workspace = true, features = ["test"] }
amml-ui.workspace = true
hcl-rs.workspace = true
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[[example]]
name = "write_manifest"
path = "examples/write_manifest.rs"
